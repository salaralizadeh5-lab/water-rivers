<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087ea4"><meta name="apple-mobile-web-app-capable" content="yes"><title>پایش هوشمند منابع آب — نسخه نهایی مهندسی</title><link rel="manifest" href="manifest.json"><style>
:root{--p:#087ea4;--p2:#00a8c8;--deep:#075b75;--bg:#f1f7f9;--card:#fff;--line:#d8e7eb;--text:#17323d;--muted:#67808b;--danger:#c0392b;--warn:#d97706;--ok:#138a5b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf8fc,#f6fafb);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:11px 14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700}button.secondary{background:#e6f4f8;color:var(--deep);box-shadow:none}.danger{background:linear-gradient(135deg,#a92f24,#d64b3c)}header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#075b75,#087ea4 60%,#00a8c8);color:#fff;padding:13px 15px;box-shadow:0 8px 22px #075b7530}.head{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff22;padding:7px}.logo img{width:100%;height:100%}.head h1{font-size:19px;margin:0}.head small{opacity:.9}.wrap{max-width:1100px;margin:auto;padding:14px 13px 100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 25px #0a485a12}.stat b{display:block;font-size:26px;color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin:11px 0;box-shadow:0 8px 25px #0a485a12}.card h2,.card h3{margin-top:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:12px;color:#54717c;margin-top:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbdfe5;border-radius:12px;background:#fff;color:var(--text);margin:5px 0 9px}textarea{min-height:90px}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#e7f4f8;color:var(--deep);font-size:11px;font-weight:700}.A{border-right:5px solid var(--danger)}.B{border-right:5px solid var(--warn)}.C{border-right:5px solid #3977d7}.muted{color:var(--muted);font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.hidden{display:none!important}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 7px}.tabs button{white-space:nowrap}.tabs button.active{background:#075b75}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px env(safe-area-inset-right) calc(6px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}.nav{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;color:#57717b;box-shadow:none;font-size:11px;padding:8px 2px}.nav button.active{color:var(--p);font-weight:800}.nav span{display:block;font-size:19px}.fab{position:fixed;left:15px;bottom:77px;width:56px;height:56px;border-radius:50%;z-index:25;font-size:24px;padding:0}.list{max-height:55vh;overflow:auto}.quality{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}.tablewrap{overflow:auto}.mini{font-size:11px}.success{background:#e8f8f0;color:#087443}.dangerTxt{background:#ffebe8;color:#9d2b21}.preview{max-height:180px;max-width:100%;border-radius:12px;margin-top:8px}.coord{direction:ltr;text-align:left;font-family:monospace}.search{position:sticky;top:78px;z-index:10;background:#f1f7f9;padding:7px 0}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photoGrid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,1fr)}}

</style></head><body><header><div class="head"><div class="logo"><img src="assets/icon.svg"></div><div><h1>پایش هوشمند منابع آب</h1><small>نسخه نهایی مهندسی — رودخانه، بستر، حریم، تخلفات و پیمایش</small></div></div></header><div class="wrap" id="app"></div><button class="fab" onclick="show('new')">＋</button><div class="bottom"><div class="nav"><button data-p="home"><span>⌂</span>داشبورد</button><button data-p="new"><span>📍</span>ثبت نقطه</button><button data-p="rivers"><span>〰️</span>رودخانه‌ها</button><button data-p="map"><span>🗺️</span>نقشه</button><button data-p="more"><span>☰</span>بیشتر</button></div></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const TYPES=['برداشت آب','برداشت غیرمجاز','آبفروشی','احداث بنا','تجاوز به بستر','تجاوز به حریم','انسداد رودخانه','پل','دیوارکشی','خاکریزی','تخلیه نخاله','تصرف اراضی','چاه','قنات','چشمه','آبراهه','حادثه خیز','لایروبی','تعمیر و نگهداری','سازه آبی','سایر'];
let db={rivers:[],points:[],photos:[],cases:[],tracks:[],settings:{gpsAccuracy:20},historical:[],waterBank:[]},gps=null,track=null,watch=null;
const IDB='WaterMonitor_Final_Engineering',VER=2;let idb;
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(IDB,VER);r.onupgradeneeded=()=>{let d=r.result;['meta','photos'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});};r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>rej(r.error)})}
async function load(){
 await openDB();
 let x=await get('meta','db');
 let seed=null;
 try{seed=await fetch('./data/seed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('seed unavailable');return r.json()})}catch(e){console.warn('Seed data unavailable',e)}
 if(x){
   db=x.value||{};
   db.rivers=Array.isArray(db.rivers)?db.rivers:[]; db.points=Array.isArray(db.points)?db.points:[]; db.historical=Array.isArray(db.historical)?db.historical:[]; db.waterBank=Array.isArray(db.waterBank)?db.waterBank:[]; db.photos=Array.isArray(db.photos)?db.photos:[]; db.cases=Array.isArray(db.cases)?db.cases:[]; db.tracks=Array.isArray(db.tracks)?db.tracks:[]; db.settings=db.settings||{gpsAccuracy:20};
   if(seed){
     if(!db.rivers.some(r=>r.id==='DLI-001')) db.rivers.unshift({id:'DLI-001',name:'دلیچایی',province:'تهران',county:'دماوند',active:true,created:new Date().toISOString()});
     if(db.historical.length===0 && seed.historical?.length) db.historical=seed.historical;
     if(db.waterBank.length===0 && seed.waterBank?.length) db.waterBank=seed.waterBank;
     if(db.points.length===0 && seed.points?.length) db.points=seed.points;
   }
   await put('meta',{id:'db',value:db});
 }else{
   if(!seed) seed={points:[],historical:[],waterBank:[]};
   db.rivers=[{id:'DLI-001',name:'دلیچایی',province:'تهران',county:'دماوند',active:true,created:new Date().toISOString()}];
   db.points=seed.points||[]; db.historical=seed.historical||[]; db.waterBank=seed.waterBank||[]; db.photos=[]; db.cases=[]; db.tracks=[]; db.settings={gpsAccuracy:20}; await put('meta',{id:'db',value:db});
 }
 show('home');
}
function get(store,id){return new Promise((res,rej)=>{let q=idb.transaction(store).objectStore(store).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function put(store,v){return new Promise((res,rej)=>{let q=idb.transaction(store,'readwrite').objectStore(store).put(v);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}function save(){return put('meta',{id:'db',value:db})}
function nav(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p))}function show(p){nav(p);if(p==='home')home();else if(p==='new')newPoint();else if(p==='rivers')rivers();else if(p==='map')mapPage();else more()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));
function home(){let a=db.points.filter(x=>x.riskLevel==='A').length;app.innerHTML=`<div class="grid"><div class="stat"><b>${db.rivers.filter(r=>r.active).length}</b>رودخانه فعال</div><div class="stat"><b>${db.points.length}</b>نقطه پایش</div><div class="stat"><b>${a}</b>ریسک A</div><div class="stat"><b>${db.cases.length}</b>پرونده</div></div><div class="card"><h3>عملیات سریع</h3><div class="row"><button onclick="show('new')">📍 ثبت نقطه جدید</button><button class="secondary" onclick="startTrack()">🚶 شروع پیمایش</button><button class="secondary" onclick="show('map')">🗺️ نقشه</button><button class="secondary" onclick="exportKMLAll()">🌍 KML همه نقاط</button></div></div><div class="card"><h3>آخرین نقاط</h3>${db.points.slice(-8).reverse().map(card).join('')||'<div class="muted">هنوز نقطه‌ای ثبت نشده.</div>'}</div><div class="card"><h3>کنترل کیفیت سریع</h3>${quality(true)}</div>`}
function card(p){return `<div class="card ${p.riskLevel||'C'}"><div class="row"><span class="badge">${esc(p.pointType)}</span><span class="badge">ریسک ${esc(p.riskLevel||'')}</span><span class="badge">${esc(p.source||'')}</span></div><b>${esc(p.pointId)}</b><div>${esc(p.riverName)} — ${esc(p.date||'')}</div><div class="coord">${Number(p.latitude).toFixed(7)}, ${Number(p.longitude).toFixed(7)}</div><div class="muted">UTM ${p.utmZone}${p.utmHemisphere} / ${Number(p.utmEasting).toFixed(3)} / ${Number(p.utmNorthing).toFixed(3)}</div><div class="row"><button class="secondary" onclick="openEarth(${p.latitude},${p.longitude})">🌍 Google Earth</button><button class="secondary" onclick="editPoint('${p.pointId}')">✏️ ویرایش</button><button class="secondary" onclick="kmlPoint('${p.pointId}')">KML</button></div></div>`}
function newPoint(editId){let p=editId?db.points.find(x=>x.pointId===editId):null;let opts=db.rivers.filter(r=>r.active).map(r=>`<option value="${r.id}" ${p&&p.riverId===r.id?'selected':''}>${esc(r.name)}</option>`).join('');app.innerHTML=`<div class="card"><h2>${p?'ویرایش نقطه':'ثبت نقطه جدید'}</h2><label>رودخانه</label><select id="river">${opts}</select><div class="row"><button onclick="getGPS()">📍 دریافت GPS دقیق</button><span id="gpsmsg" class="muted">WGS84 + UTM، دقت با آستانه ${db.settings.gpsAccuracy} متر</span></div><div class="two"><div><label>Latitude</label><input id="lat" class="coord" value="${p?.latitude??''}"></div><div><label>Longitude</label><input id="lon" class="coord" value="${p?.longitude??''}"></div><div><label>UTM Zone</label><input id="zone" readonly value="${p?.utmZone??''}"></div><div><label>Hemisphere</label><input id="hemi" readonly value="${p?.utmHemisphere??''}"></div><div><label>Easting</label><input id="east" readonly value="${p?.utmEasting??''}"></div><div><label>Northing</label><input id="north" readonly value="${p?.utmNorthing??''}"></div><div><label>Altitude (m)</label><input id="alt" value="${p?.altitude??''}"></div><div><label>GPS Accuracy (m)</label><input id="acc" value="${p?.accuracy??''}"></div></div><label>نوع نقطه</label><select id="type">${TYPES.map(x=>`<option ${p?.pointType===x?'selected':''}>${x}</option>`).join('')}</select><div class="two"><div><label>بستر</label><input id="bed" value="${esc(p?.bedStatus||'')}"></div><div><label>حریم</label><input id="buffer" value="${esc(p?.bufferStatus||'')}"></div><div><label>وضعیت آبراهه</label><input id="water" value="${esc(p?.waterwayStatus||'')}"></div><div><label>ریسک</label><select id="risk"><option ${p?.riskLevel==='A'?'selected':''}>A</option><option ${p?.riskLevel==='B'?'selected':''}>B</option><option ${!p||p?.riskLevel==='C'?'selected':''}>C</option></select></div></div><label>نوع تخلف/مورد مشاهده</label><input id="violation" value="${esc(p?.violationType||'')}"><label>شرح وضعیت</label><textarea id="desc">${esc(p?.description||'')}</textarea><label>اقدام انجام‌شده</label><textarea id="action">${esc(p?.action||'')}</textarea><div class="two"><div><label>شماره پرونده</label><input id="caseNo" value="${esc(p?.caseNumber||'')}"></div><div><label>شماره اخطار</label><input id="warningNo" value="${esc(p?.warningNumber||'')}"></div><div><label>وضعیت پیگیری</label><input id="follow" value="${esc(p?.followUpStatus||'')}"></div><div><label>بازدید بعدی</label><input id="next" value="${esc(p?.nextVisit||'')}" type="date"></div></div><label>کارشناس</label><input id="insp" value="${esc(p?.inspector||'کارشناس فعلی')}"><label>عکس‌ها — مختصات لحظه ثبت در رکورد عکس ذخیره می‌شود</label><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="photoPreview"></div><div class="row"><button onclick="savePointForm('${editId||''}')">💾 ذخیره</button><button class="secondary" onclick="show('home')">انصراف</button></div></div>`;['lat','lon'].forEach(id=>$(id).oninput=()=>calcUTM());if(p)calcUTM();$('photos').onchange=previewPhotos}
function editPoint(id){newPoint(id)}
function calcUTM(){let la=parseFloat(lat.value),lo=parseFloat(lon.value);if(!isFinite(la)||!isFinite(lo))return;let u=utm(la,lo);zone.value=u.zone;hemi.value=la<0?'S':'N';east.value=u.e.toFixed(3);north.value=u.n.toFixed(3)}
function utm(lat,lon){let a=6378137,e=0.00669438,k=.9996,z=Math.floor((lon+180)/6)+1,lo=(z-1)*6-180+3,lr=lat*Math.PI/180,or=lo*Math.PI/180,ep=e/(1-e),N=a/Math.sqrt(1-e*Math.sin(lr)**2),T=Math.tan(lr)**2,C=ep*Math.cos(lr)**2,A=Math.cos(lr)*(lon*Math.PI/180-or),M=a*((1-e/4-3*e*e/64-5*e**3/256)*lr-(3*e/8+3*e*e/32+45*e**3/1024)*Math.sin(2*lr)+(15*e*e/256+45*e**3/1024)*Math.sin(4*lr)-(35*e**3/3072)*Math.sin(6*lr)),E=k*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep)*A**5/120)+500000,NN=k*(M+N*Math.tan(lr)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep)*A**6/720));if(lat<0)NN+=1e7;return{zone:z,e:E,n:NN}}
function getGPS(){if(!navigator.geolocation){gpsmsg.textContent='GPS این مرورگر در دسترس نیست.';return}gpsmsg.textContent='در حال نمونه‌برداری دقیق GPS…';let samples=[];let count=0;let id=navigator.geolocation.watchPosition(pos=>{samples.push(pos.coords);count++;if(count>=5){navigator.geolocation.clearWatch(id);samples.sort((a,b)=>a.accuracy-b.accuracy);let c=samples[0];lat.value=c.latitude.toFixed(9);lon.value=c.longitude.toFixed(9);alt.value=c.altitude==null?'':c.altitude.toFixed(2);acc.value=c.accuracy.toFixed(2);calcUTM();gps={latitude:c.latitude,longitude:c.longitude,altitude:c.altitude,accuracy:c.accuracy,source:'device_gps'};gpsmsg.innerHTML=`<span class="${c.accuracy<=db.settings.gpsAccuracy?'ok':'warn'}">دقت انتخاب‌شده: ${c.accuracy.toFixed(1)} m</span>`}},e=>gpsmsg.textContent='خطای GPS: '+e.message,{enableHighAccuracy:true,maximumAge:0,timeout:15000});setTimeout(()=>navigator.geolocation.clearWatch(id),30000)}
function previewPhotos(){let files=[...photos.files];photoPreview.innerHTML=files.map(f=>`<div class="mini">${esc(f.name)}</div>`).join('')}
async function savePointForm(editId){let la=parseFloat(lat.value),lo=parseFloat(lon.value);if(!isFinite(la)||!isFinite(lo)){alert('مختصات معتبر وارد کنید.');return}calcUTM();let r=db.rivers.find(x=>x.id===river.value);let p=editId?db.points.find(x=>x.pointId===editId):null;let id=p?p.pointId:`${r.id}-P-${String(db.points.filter(x=>x.riverId===r.id).length+1).padStart(4,'0')}`;let u=utm(la,lo);let now=new Date();let obj={pointId:id,riverId:r.id,riverName:r.name,date:p?.date||now.toLocaleDateString('fa-IR'),time:p?.time||now.toLocaleTimeString('fa-IR'),latitude:la,longitude:lo,utmZone:u.zone,utmHemisphere:la<0?'S':'N',utmEasting:u.e,utmNorthing:u.n,altitude:parseFloat(alt.value)||null,accuracy:parseFloat(acc.value)||null,pointType:type.value,bedStatus:bed.value,bufferStatus:buffer.value,waterwayStatus:water.value,violationType:violation.value,description:desc.value,action:action.value,riskLevel:risk.value,caseId:p?.caseId||'',caseNumber:caseNo.value,warningNumber:warningNo.value,followUpStatus:follow.value,nextVisit:next.value,inspector:insp.value,photoCount:0,notes:p?.notes||'',source:p?.source||'field',gpsSource:gps?.source||'manual',createdAt:p?.createdAt||now.toISOString(),updatedAt:now.toISOString()};if(p)Object.assign(p,obj);else db.points.push(obj);let files=[...photos.files];for(let f of files){let idp='PHOTO-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);let data=await fileData(f);await put('photos',{id:idp,pointId:id,riverId:r.id,name:f.name,type:f.type,data,createdAt:now.toISOString(),latitude:la,longitude:lo,utmZone:u.zone,utmEasting:u.e,utmNorthing:u.n,gpsSource:gps?.source||'point_capture'});obj.photoCount++}await save();alert('نقطه با مختصات دقیق ذخیره شد.');show('home')}
function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function rivers(){app.innerHTML=`<div class="card"><h2>رودخانه‌ها</h2><button onclick="addRiver()">＋ افزودن رودخانه</button><p class="muted">نامحدود — هر رودخانه شناسه مستقل، نقاط و خروجی KML جداگانه دارد.</p></div>`+db.rivers.map(r=>`<div class="card"><h3>💧 ${esc(r.name)}</h3><div class="muted">${esc(r.id)} — ${esc(r.province||'')} ${esc(r.county||'')}</div><p>${db.points.filter(p=>p.riverId===r.id).length} نقطه</p><div class="row"><button class="secondary" onclick="riverKML('${r.id}')">🌍 KML رودخانه</button></div></div>`).join('')}
function addRiver(){let n=prompt('نام رودخانه:');if(!n)return;let id='RIV-'+String(db.rivers.length+1).padStart(3,'0');db.rivers.push({id,name:n,active:true,created:new Date().toISOString()});save();rivers()}
function mapPage(){let p=db.points[0];let src=p?`https://www.openstreetmap.org/export/embed.html?bbox=${p.longitude-.04}%2C${p.latitude-.04}%2C${p.longitude+.04}%2C${p.latitude+.04}&layer=mapnik&marker=${p.latitude}%2C${p.longitude}`:'https://www.openstreetmap.org/export/embed.html?bbox=52%2C35%2C53%2C36&layer=mapnik';app.innerHTML=`<div class="card"><h2>نقشه نقاط</h2><iframe style="width:100%;height:430px;border:0;border-radius:14px" src="${src}"></iframe><p class="muted">نقشه پایه برای نمایش به اینترنت نیاز دارد؛ مختصات و KML مستقل از نقشه ذخیره می‌شوند.</p></div><div class="search"><input id="q" placeholder="جستجو در نقاط و سوابق سنواتی…" oninput="searchAll()"></div><div id="results">${db.points.map(card).join('')}</div>`}
function searchAll(){let q=$('q').value.trim().toLowerCase();let ps=db.points.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q));let hs=[];if(q)for(let sh of db.historical)for(let i=1;i<sh.rows.length;i++){let s=sh.rows[i].join(' ').toLowerCase();if(s.includes(q))hs.push({sheet:sh.sheet,row:i+1,data:sh.rows[i]});if(hs.length>=100)break}results.innerHTML=(ps.map(card).join('')||'')+(hs.length?`<div class="card"><h3>سوابق سنواتی (${hs.length})</h3>${hs.map(x=>`<div class="quality"><span>${esc(x.sheet)} — ردیف ${x.row}</span><span class="muted">${esc(x.data.slice(0,5).join(' | '))}</span></div>`).join('')}</div>`:'')||'<div class="card muted">نتیجه‌ای یافت نشد.</div>'}
function historicalExplorer(){

function managementReport(){let total=db.historical.reduce((a,s)=>a+Math.max(0,s.rows.length-1),0),A=db.points.filter(p=>p.riskLevel==='A').length;let openCases=db.cases.filter(c=>c.status!=='مختومه').length;app.innerHTML=`<div class="card"><h2>📋 گزارش مدیریتی خودکار</h2><p>گزارش بر اساس آخرین داده‌های داخل برنامه تولید شده و برای چاپ/ذخیره PDF آماده است.</p><div class="grid"><div class="stat"><b>${db.rivers.length}</b>رودخانه</div><div class="stat"><b>${db.points.length}</b>نقطه فعلی</div><div class="stat"><b>${A}</b>ریسک A</div><div class="stat"><b>${openCases}</b>پرونده باز</div></div><h3>خلاصه مدیریتی</h3><ul><li>تعداد سوابق سنواتی: <b>${total.toLocaleString()}</b></li><li>موارد پرخطر فعلی (ریسک A): <b>${A}</b></li><li>پرونده‌های نیازمند پیگیری: <b>${openCases}</b></li><li>برای تحلیل دقیق رودخانه‌ای، از بخش «تفکیک سوابق سنواتی» استفاده کنید.</li></ul><button onclick="window.print()">🖨 چاپ / ذخیره PDF</button></div>`}

const CRC_TABLE=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(a){let c=0xffffffff;for(let i=0;i<a.length;i++)c=CRC_TABLE[(c^a[i])&255]^(c>>>8);return (c^0xffffffff)>>>0}function u16(n){return new Uint8Array([n&255,n>>>8&255])}function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}function cat(...aa){let n=aa.reduce((s,a)=>s+a.length,0),o=new Uint8Array(n),i=0;for(let a of aa){o.set(a,i);i+=a.length}return o}function zipStore(files){let enc=new TextEncoder(),local=[],central=[],offset=0;for(let f of files){let name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);let h=cat(new Uint8Array([80,75,3,4,20,0,0,0,0,0,0,0,0,0]),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data);local.push(h);let ch=cat(new Uint8Array([80,75,1,2,20,0,20,0,0,0,0,0,0,0,0,0]),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name);central.push(ch);offset+=h.length}let c=cat(...central),l=cat(...local),e=cat(new Uint8Array([80,75,5,6,0,0,0,0]),u16(files.length),u16(files.length),u32(c.length),u32(l.length),u16(0));return cat(l,c,e)}
function colName(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}function sheetXML(rows){let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1"/></sheetViews><sheetData>';rows.forEach((r,ri)=>{out+=`<row r="${ri+1}">`;r.forEach((v,ci)=>{if(v===null||v===undefined||v==='')return;let s=String(v),ref=colName(ci+1)+(ri+1),num=typeof v==='number'&&!isNaN(v);out+=num?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xml(s)}</t></is></c>`});out+='</row>'});return out+'</sheetData><autoFilter ref="A1:'+colName(Math.max(1,rows[0]?.length||1))+rows.length+'"/><sheetFormatPr defaultRowHeight="18"/></worksheet>'}

function xlsxFiles(){let names=['گزارش مدیریتی','رودخانه‌ها','بازدیدها','نقاط و مختصات','تخلفات','پرونده‌ها','آب‌فروشی','عکس‌ها','پیمایش‌ها','سوابق سنواتی','آمار','کنترل کیفیت'];let data={};data['گزارش مدیریتی']=[['گزارش مدیریت پایش منابع آب'],['تاریخ تولید',new Date().toLocaleString('fa-IR')],['رودخانه فعال',db.rivers.filter(r=>r.active).length],['نقطه پایش',db.points.length],['ریسک A',db.points.filter(p=>p.riskLevel==='A').length],['سوابق سنواتی',db.historical.reduce((a,s)=>a+Math.max(0,s.rows.length-1),0)],['بانک آبفروشی',db.waterBank.length?Math.max(0,db.waterBank[0].rows.length-1):0],['وضعیت کنترل کیفیت','آماده ارائه به مدیریت']];data['رودخانه‌ها']=[['River ID','River Name','Province','County','Active'],...db.rivers.map(r=>[r.id,r.name,r.province||'',r.county||'',r.active?'بله':'خیر'])];data['بازدیدها']=buildRows();data['نقاط و مختصات']=[['Point ID','River ID','River Name','Date','Time','Latitude','Longitude','UTM Zone','UTM Hemisphere','UTM Easting','UTM Northing','Altitude','GPS Accuracy','GPS Source','Point Type'],...db.points.map(p=>[p.pointId,p.riverId,p.riverName,p.date,p.time,p.latitude,p.longitude,p.utmZone,p.utmHemisphere,p.utmEasting,p.utmNorthing,p.altitude,p.accuracy,p.gpsSource,p.pointType])];data['تخلفات']=[['Point ID','River Name','Date','Point Type','Violation Type','Risk Level','Description','Action','Follow-up Status'],...db.points.filter(p=>p.violationType).map(p=>[p.pointId,p.riverName,p.date,p.pointType,p.violationType,p.riskLevel,p.description,p.action,p.followUpStatus])];data['پرونده‌ها']=[['Case ID','Case Number','Point ID','Status'],...db.cases.map(x=>[x.id,x.number||'',x.pointId||'',x.status||''])];data['آب‌فروشی']=[['منبع','ردیف','داده'],...db.waterBank.flatMap(sh=>sh.rows.slice(1).map((r,i)=>[sh.sheet,i+2,r.join(' | ')]))];data['عکس‌ها']=[['Photo ID','Point ID','River ID','Date','Time','Latitude','Longitude','UTM Zone','UTM Easting','UTM Northing','Filename','Geo-tag Status'],[]];data['پیمایش‌ها']=[['Track ID','River ID','Start','End function exportXLSX(){let sheets=xlsxFiles(),enc=new TextEncoder(),files=[];let ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';sheets.forEach((s,i)=>ct+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);ct+='</Types>';files.push({name:'[Content_Types].xml',data:ct});files.push({name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});let wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';sheets.forEach((s,i)=>wb+=`<sheet name="${xml(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`);wb+='</sheets></workbook>';files.push({name:'xl/workbook.xml',data:wb});let rel='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';sheets.forEach((s,i)=>rel+=`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`);rel+='</Relationships>';files.push({name:'xl/_rels/workbook.xml.rels',data:rel});sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(s[1])}));let bytes=zipStore(files);download(bytes,'WaterMonitor_Engineering
